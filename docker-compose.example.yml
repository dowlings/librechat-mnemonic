# Drop-in fragment for an existing LibreChat stack.
#
# The only requirement is that this service can reach the same MongoDB that
# LibreChat uses, because that is where the conversation -> project mapping
# lives. Nothing is written to LibreChat's own collections.

services:
  librechat-mnemonic:
    image: ghcr.io/claudedowling/librechat-mnemonic:latest
    # Or build from source:
    # build: https://github.com/claudedowling/librechat-mnemonic.git
    container_name: librechat-mnemonic
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      # ── LibreChat ─────────────────────────────────────────────────────────
      LIBRECHAT_MONGO_URI: mongodb://mongo:27017/LibreChat

      # ── Providers this proxy sits in front of ─────────────────────────────
      # `baseUrl` is the provider root: <baseUrl>/v1/chat/completions must be
      # valid for api=openai, and <baseUrl>/v1/messages for api=anthropic.
      # The `litellm` entry is only needed if you run the optional LiteLLM
      # service below. It is an ordinary upstream — LiteLLM speaks OpenAI format
      # on the same path — but it resolves a tier name such as `advanced` to an
      # ordered list of real providers. See the "Tiered models" README section.
      UPSTREAMS: >-
        [
          {"name":"openai","baseUrl":"https://api.openai.com","api":"openai"},
          {"name":"anthropic","baseUrl":"https://api.anthropic.com","api":"anthropic"},
          {"name":"litellm","baseUrl":"http://litellm:4000","api":"openai","apiKey":"${LITELLM_VIRTUAL_KEY}"}
        ]

      # ── mnemonic ──────────────────────────────────────────────────────────
      MNEMONIC_VAULT_PATH: /vault
      MNEMONIC_PROJECT_ROOT: /projects
      # Local embeddings. Point at any Ollama reachable from this container.
      EMBED_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: nomic-embed-text-v2-moe
      # Set true if the vault is not a git repo and you do not want git sync.
      DISABLE_GIT: "false"

      # ── Behaviour ─────────────────────────────────────────────────────────
      MEMORY_DEFAULT_ENABLED: "true"
      MEMORY_WRITE_MODE: llm
      MNEMONIC_WRITE_SCOPE: global
      MNEMONIC_RECALL_SCOPE: all
      # Give the model a clock. Set false to send prompts through untouched.
      PROMPT_DATETIME_ENABLED: "true"

      # ── Caching ───────────────────────────────────────────────────────────
      # Tune these if you need more or less freshness. Defaults are aggressive.
      CACHE_NOTE_BODY_TTL_MS: "300000"
      CACHE_RECALL_TTL_MS: "120000"
      CACHE_SETTINGS_TTL_MS: "30000"

      # A small, cheap model does the extraction. Omit to reuse the chat's own
      # model, which works but costs more.
      #
      # If you use the LiteLLM tiers below, pin these explicitly. Left unset,
      # extraction reuses the chat's upstream and model — which under a tier
      # means it inherits the failover chain and can quietly run on the
      # expensive fallback.
      EXTRACT_BASE_URL: https://api.openai.com/v1
      EXTRACT_MODEL: gpt-4o-mini
      EXTRACT_API_KEY: ${OPENAI_API_KEY}

      # ── Telemetry ─────────────────────────────────────────────────────────
      # Share these with LibreChat's own Langfuse config so traces correlate
      # by sessionId (conversationId). Store in 1Password or your secret manager.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      # Must match LibreChat's Langfuse environment so both sets of traces group together.
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}

      LOG_LEVEL: info
    volumes:
      # The vault. Point this at an existing mnemonic vault to share one memory
      # store with your other tools, or let it start empty.
      - mnemonic-vault:/vault
      # One directory per LibreChat project. These give mnemonic its project
      # identity, so the volume must persist. Keep it outside any git repo.
      - mnemonic-projects:/projects
    networks:
      - librechat-network
    # No published port: only LibreChat needs to reach it.
    expose:
      - "8710"

  # Local embeddings for mnemonic. Skip this and set EMBED_PROVIDER=openai or
  # gemini if you would rather not run a model locally.
  ollama:
    image: ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: librechat-mnemonic-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - librechat-network

  # ── Optional: tiered models with ordered failover ───────────────────────────
  # Drop these two services if you do not need failover. Nothing else in this
  # file depends on them.
  #
  # LiteLLM turns `basic` / `standard` / `advanced` into models backed by an
  # ordered list of real providers, so a LibreChat agent bound to `advanced`
  # keeps working when the first provider runs out of credit. mnemonic stays in
  # front, so memory injection happens once per turn regardless of which
  # provider answers. See examples/litellm-config.yaml.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      - litellm-db
    command: ["--config", "/app/config.yaml"]
    environment:
      # Root credential. Must start with `sk-`. It grants unlimited spend and
      # full API access, so keep it out of every other service: mint a scoped
      # virtual key in the UI and put that in UPSTREAMS above.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # Lets you add and edit models from the admin UI instead of this file.
      # Database models and config.yaml models coexist; pick one as the source
      # of truth or you will confuse yourself.
      STORE_MODEL_IN_DB: "True"
      # Provider credentials live here, not in LibreChat.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Same Langfuse project and environment as LibreChat and mnemonic.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks:
      - librechat-network
    # No published port. mnemonic reaches it over the docker network, and the
    # admin UI is reached through your existing cloudflared container — add an
    # ingress rule for a new hostname pointing at http://litellm:4000 and put
    # your existing Cloudflare Access policy on the WHOLE hostname.
    #
    # Do not carve /v1/* out of the Access policy to "make the API work from
    # outside": that publishes the proxy API to the internet with nothing but a
    # virtual key in front of it. Use an Access service token instead.
    expose:
      - "4000"

  # LiteLLM needs Postgres for the admin UI, virtual keys and the spend ledger.
  # Budgets are the reason the database is here; without it LiteLLM is
  # config-file only and has neither UI nor budgets.
  #
  # If your LibreChat stack already runs the RAG API's pgvector container, you
  # can point DATABASE_URL at that instance instead — use a separate database
  # name, since LiteLLM runs its own Prisma migrations.
  litellm-db:
    image: postgres:17-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - librechat-network

volumes:
  mnemonic-vault:
  mnemonic-projects:
  ollama-data:
  litellm-db-data:

networks:
  librechat-network:
    external: true