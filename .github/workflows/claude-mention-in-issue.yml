# Claude mentions in issues and pull requests
#
# Trusted contributors can mention @claude in an issue comment, pull-request
# review comment, or submitted pull-request review. Claude may inspect, edit,
# test, commit, and push changes, but must not merge them.
#
# Issue runs preserve unfinished work on Claude's generated branch and create
# a draft PR. Continue failed work by mentioning Claude on that draft PR so a
# later run reuses the preserved branch and receives CI/review context.
#
# Requires the organization-level CLAUDE_CODE_OAUTH_TOKEN secret.

name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.issue.number ||
      github.event.pull_request.number
    }}
  cancel-in-progress: false

jobs:
  respond:
    if: >-
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body || '', '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body || '', '@claude'))
      ) &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association) ||
        (github.event_name == 'issue_comment' && github.event.comment.user.login == 'coding-agent-via-token-broker[bot]')
      ) &&
      (
        github.event_name == 'issue_comment' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base branch
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Select Claude model
        id: model
        shell: bash
        env:
          COMMENT_BODY: >-
            ${{
              github.event.comment.body ||
              github.event.review.body ||
              ''
            }}
        run: |
          set -euo pipefail

          body="$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]')"

          case "$body" in
            *"@claude opus"*)
              model="claude-opus-5"
              ;;
            *"@claude haiku"*)
              model="claude-haiku-4-5"
              ;;
            *)
              model="claude-sonnet-5"
              ;;
          esac

          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Respond with Claude
        id: claude
        # v1.0.198
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          base_branch: main
          branch_prefix: claude/
          allowed_bots: coding-agent-via-token-broker[bot]
          claude_args: |
            --max-turns 100
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Bash(*)"
            --append-system-prompt "Read and follow AGENTS.md and repository documentation. For implementation requests, inspect the full issue or pull-request context, make focused changes, add or update tests, and run all documented validation. Commit and push coherent checkpoints throughout longer tasks instead of waiting until the end. Work only on the action-selected branch, create or update a pull request targeting main when working from an issue, and do not merge."

      - name: Preserve unfinished Claude changes
        if: always() && steps.claude.outputs.branch_name != ''
        shell: bash
        env:
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          set -euo pipefail

          # This relies on use_commit_signing remaining false: the official
          # action then checks out its generated branch locally. Revisit this
          # guard if API-based commit signing is enabled.
          current_branch="$(git branch --show-current)"
          if [ "$current_branch" != "$CLAUDE_BRANCH" ]; then
            echo "Expected Claude branch '$CLAUDE_BRANCH', found '$current_branch'; refusing to push."
            exit 1
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No unfinished changes to preserve."
            exit 0
          fi

          echo "Preserving unfinished changes on $CLAUDE_BRANCH:"
          git status --short

          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No committable changes to preserve."
            exit 0
          fi

          git commit -m "WIP: preserve unfinished Claude changes"
          git push origin "HEAD:$CLAUDE_BRANCH"

      - name: Create draft pull request for issue work
        if: >-
          always() &&
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          steps.claude.outputs.branch_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "$CLAUDE_BRANCH" >/dev/null 2>&1; then
            echo "Claude branch was not pushed; no draft pull request is needed."
            exit 0
          fi

          git fetch origin "$CLAUDE_BRANCH"
          if git diff --quiet origin/main..."origin/$CLAUDE_BRANCH"; then
            echo "Claude branch has no changes from main; no draft PR needed."
            exit 0
          fi

          existing_url="$(gh pr list --head "$CLAUDE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_url" ]; then
            echo "Pull request already exists: $existing_url"
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<EOF
          Work in progress for #$ISSUE_NUMBER.

          Claude's branch is preserved even if an agent run fails. Review the commits and CI before continuing.

          To continue unfinished work, comment on this draft PR:

          \`@claude Continue implementation. Review the original issue and existing WIP changes, finish the remaining acceptance criteria, run all documented validation, commit and push to this PR branch, and do not merge.\`

          Closes #$ISSUE_NUMBER
          EOF

          gh pr create \
            --draft \
            --base main \
            --head "$CLAUDE_BRANCH" \
            --title "WIP: $ISSUE_TITLE" \
            --body-file "$body_file"